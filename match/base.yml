matches:
  - trigger: ":like"
    replace: "Curtiu o vídeo? Deixa o seu like para ajudar o canal a crescer!"

  - trigger: ":getcontent"
    replace: "get-content -path 'C:\\Pasta\\Logs\\{{current_date}}.txt' -wait -tail"
    vars:
      - name: current_date
        type: date
        params:
          format: "%d-%m-%Y"

  - trigger: ":fakecpf"
    replace: "{{cpf}}"
    vars:
      - name: cpf
        type: script
        params:
          args:
            - python
            - -c
            - |
              import random
              n = [random.randint(0, 9) for _ in range(9)]
              for w in (10, 11):
                  r = sum(d * (w - i) for i, d in enumerate(n)) % 11
                  n.append(0 if r < 2 else 11 - r)
              s = "".join(map(str, n))
              print(f"{s[:3]}.{s[3:6]}.{s[6:9]}-{s[9:]}", end="")

  - trigger: ":fakencpf"
    replace: "{{cpf}}"
    vars:
      - name: cpf
        type: script
        params:
          args:
            - python
            - -c
            - |
              import random
              n = [random.randint(0, 9) for _ in range(9)]
              for w in (10, 11):
                  r = sum(d * (w - i) for i, d in enumerate(n)) % 11
                  n.append(0 if r < 2 else 11 - r)
              print("".join(map(str, n)), end="")

  - trigger: ":fakecnpj"
    replace: "{{cnpj}}"
    vars:
      - name: cnpj
        type: script
        params:
          args:
            - python
            - -c
            - |
              import random
              n = [random.randint(0, 9) for _ in range(8)] + [0, 0, 0, 1]
              w1 = [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]
              for w in (w1, [6] + w1):
                  r = sum(d * p for d, p in zip(n, w)) % 11
                  n.append(0 if r < 2 else 11 - r)
              s = "".join(map(str, n))
              print(f"{s[:2]}.{s[2:5]}.{s[5:8]}/{s[8:12]}-{s[12:]}", end="")

  - trigger: ":fakencnpj"
    replace: "{{cnpj}}"
    vars:
      - name: cnpj
        type: script
        params:
          args:
            - python
            - -c
            - |
              import random
              n = [random.randint(0, 9) for _ in range(8)] + [0, 0, 0, 1]
              w1 = [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]
              for w in (w1, [6] + w1):
                  r = sum(d * p for d, p in zip(n, w)) % 11
                  n.append(0 if r < 2 else 11 - r)
              print("".join(map(str, n)), end="")

  # Respostas e Saudações Padronizadas
  - trigger: ":obrigado"
    replace: "Qualquer dúvida, estou à disposição. Tenha um excelente dia!"

  # Variáveis Dinâmicas (Exemplo: Data Atual)
  - trigger: ":hoje"
    replace: "{{data_atual}}"
    vars:
      - name: data_atual
        type: date
        params:
          format: "%d/%m/%Y"

  # Textos com Quebra de Linha (Multilinha)
  - trigger: ":assinatura"
    replace: |
      Atenciosamente,
      Crim Level Up
      Contato: crimlevelup@email.com.br
